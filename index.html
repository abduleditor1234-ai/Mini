<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Adewa</title>

<script src="https://libtl.com/sdk.js" data-zone="11849985" data-sdk="show_11849985"></script>
<style>
:root{
  --bg:#0f1b30; --surface:#172743; --raised:#1e3357; --line:#2a4470;
  --text:#eef2f9; --muted:#93a5c2; --gold:#f0b94d; --gold-ink:#3a2700;
  --ok:#43c48f; --bad:#ef6a4c; --radius:18px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Ethiopic",sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);min-height:100%}
body{padding:14px 14px calc(88px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;font-size:15px;line-height:1.4}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2{font-size:17px;font-weight:650;margin:18px 2px 10px}
p.muted,.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .card{margin:0}
/* balance hero */
.hero{padding:22px 18px 18px;background:linear-gradient(160deg,#1f3a66 0%,#172743 70%);border-color:#35558a}
.hero .amt{font-size:46px;font-weight:750;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:6px}
.hero .amt small{font-size:16px;color:var(--gold);font-weight:600;letter-spacing:0;margin-left:6px}
.hero .etb{color:var(--muted);margin-top:4px}
/* streak */
.flame{width:44px;height:44px;border-radius:14px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.flame .ic{width:24px;height:24px}
.badge{font-size:12px;font-weight:650;padding:3px 10px;border-radius:99px;background:var(--raised);border:1px solid var(--line)}
.badge.b1{color:#e0a26a}.badge.b2{color:#cfd8e6}.badge.b3{color:var(--gold)}
.bar{height:8px;border-radius:99px;background:var(--raised);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
/* buttons */
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;background:var(--gold);color:var(--gold-ink);font-weight:650}
.btn.ghost{background:var(--raised);color:var(--text);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 14px;border-radius:11px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){transform:scale(.98)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* inputs */
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border-radius:12px;background:var(--bg);color:var(--text);border:1px solid var(--line);margin-top:6px}
label{display:block;margin-top:12px;color:var(--muted);font-size:13px}
/* list */
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}.item:last-child{padding-bottom:0}
.item .t{font-weight:600}
.pill{font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;background:rgba(240,185,77,.15);color:var(--gold)}
.pill.ok{background:rgba(67,196,143,.15);color:var(--ok)}.pill.bad{background:rgba(239,106,76,.15);color:var(--bad)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,27,48,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;padding:6px 0;border-radius:12px}
nav button.on{color:var(--gold)}
/* spin */
.wheelbox{position:relative;width:min(78vw,300px);margin:8px auto 18px}
.pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--gold);z-index:2}
#wheel{transition:transform 4s cubic-bezier(.12,.7,.1,1)}
#wheel svg{width:100%;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.ticker{overflow:hidden;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 0;margin-bottom:6px}
.ticker span{display:inline-block;padding-left:100%;animation:tick 26s linear infinite;color:var(--muted);font-size:13px}
@keyframes tick{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:12px}#wheel{transition-duration:.01s}}
/* overlays */
#gate,#fatal{position:fixed;inset:0;background:var(--bg);z-index:50;padding:calc(28px + env(safe-area-inset-top)) 18px 24px;overflow:auto;display:none}
#gate .in,#fatal .in{max-width:480px;margin:0 auto}
#gate h1,#fatal h1{font-size:26px;line-height:1.15;letter-spacing:-.5px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--raised);border:1px solid var(--line);padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.odds div{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:13px}
.odds b{display:block;color:var(--gold)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>

  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></symbol>
</svg>

<div id="app"><div class="spinner"></div></div>

<nav id="nav" style="display:none"><div id="navin"></div></nav>

<div id="gate"><div class="in"></div></div>
<div id="fatal"><div class="in"></div></div>
<div id="toast"></div>

<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0f1b30'); tg.setBackgroundColor('#0f1b30'); } catch (e) {} }
const API = 'https://fulus-backend.vercel.app';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n) => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const fmt = (n) => Number(n).toLocaleString('en-US');
const LEVELS = ['Bronze', 'Silver', 'Gold'];

let ME = null, TAB = 'home', busy = false, gateOpen = false;
let TASKS = [], WINNERS = [], TOP = [], WDS = [], ADMIN = null, wheelKind = 'free', rot = 0;

function deviceId() {
  try { let d = localStorage.getItem('did'); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, ''); localStorage.setItem('did', d); } return d; }
  catch (e) { return 'nostore'; }
}
const ERR = {
  timeout: 'Server timeout. Check your connection and try again.', bad_auth: 'Open this app from the Telegram bot.',
  quota: 'You reached today\'s ad limit. Come back tomorrow or level up your streak.', invalid_view: 'The ad was not watched to the end.',
  no_spins: 'No free spins left today.', no_coins: 'Not enough coins.', closed: 'Withdrawals are closed right now.',
  interval: 'You can withdraw once every 2 days.', referrals: 'You need more qualified referrals to withdraw.', under_review: 'Your account is under review.',
  bad_input: 'Check the details and try again.', min: 'Amount is below the minimum.', cap: 'Daily payout limit reached. Try again tomorrow.',
  limit: 'This task is full.', already: 'Already done.', not_joined: 'Join the channel first, then tap Verify.', invalid_code: 'Invalid or expired code.',
  code_full: 'This code has no uses left.', banned: 'This account is blocked.', ads_unavailable: 'Ads could not load. Turn off ad blockers and retry.',
  ad_closed: 'Watch the full ad to earn coins.', server: 'Something went wrong. Try again.', not_recoverable: 'The streak can no longer be saved.',
};
const errMsg = (e) => {
  if (e.code === 'cooldown') return `Wait ${e.data && e.data.wait ? e.data.wait : 30}s before the next ad.`;
  return ERR[e.code] || ERR[e.message] || (e.message === 'Failed to fetch' ? ERR.timeout : e.message) || ERR.server;
};

async function api(path, body) {
  const c = new AbortController(); const to = setTimeout(() => c.abort(), 20000);
  try {
    const r = await fetch(API + path, {
      method: body ? 'POST' : 'GET', signal: c.signal,
      headers: { 'Content-Type': 'application/json', 'x-init-data': (tg && tg.initData) || '', 'x-device': deviceId() },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403 && j.error === 'gate') { openGate(); throw Object.assign(new Error('gate'), { code: 'gate' }); }
    if (!r.ok) throw Object.assign(new Error(j.error || 'server'), { code: j.error, data: j });
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw Object.assign(new Error('timeout'), { code: 'timeout' });
    throw e;
  } finally { clearTimeout(to); }
}
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
function fatal(msg) {
  $('#fatal .in').innerHTML = `<h1>Can't load the app</h1><p class="muted" style="margin:10px 0 20px">${esc(msg)}</p><button class="btn" onclick="location.reload()">Try again</button>`;
  $('#fatal').style.display = 'block';
}
function haptic(t) { try { tg && tg.HapticFeedback.notificationOccurred(t || 'success'); } catch (e) {} }

/* ---------- gatekeeper ---------- */
let GATE = null;
async function loadGate(force) {
  GATE = await api('/api/gate' + (force ? '?force=1' : ''));
  return GATE;
}
function openGate() {
  if (gateOpen) return; gateOpen = true;
  $('#gate').style.display = 'block'; $('#nav').style.display = 'none';
  loadGate(false).then(renderGate).catch((e) => toast(errMsg(e)));
}
function renderGate() {
  const g = GATE, done = g.channels.filter((c) => c.joined).length;
  $('#gate .in').innerHTML = `
    <div class="flame" style="margin-bottom:18px">${ic('lock')}</div>
    <h1>Join ${g.channels.length} channels to continue</h1>
    <p class="muted" style="margin:8px 0 20px">Join each channel, then come back here. We check again automatically.</p>
    <div class="card">${g.channels.map((c, i) => `
      <div class="item">
        <div class="grow"><div class="t">${esc(c.chat)}</div></div>
        ${c.joined ? `<span class="pill ok row" style="gap:5px">${ic('check')}Joined</span>`
          : `<button class="btn sm" onclick="joinCh(${i})">Join</button>`}
      </div>`).join('')}</div>
    <p class="muted" style="margin-bottom:12px">${done} of ${g.channels.length} joined</p>
    <button class="btn ghost" style="margin-bottom:10px" onclick="recheckGate()">Check again</button>
    <button class="btn" id="enter" ${g.ok ? '' : 'disabled'} onclick="enterApp()">Enter dashboard</button>`;
}
function joinCh(i) { const u = GATE.channels[i].url; if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u, '_blank'); }
async function recheckGate() {
  try { await loadGate(true); renderGate(); if (GATE.ok) haptic(); } catch (e) { toast(errMsg(e)); }
}
async function enterApp() { $('#gate').style.display = 'none'; gateOpen = false; await boot(); }
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  try {
    if (gateOpen) { await loadGate(true); renderGate(); }
    else if (ME) { const g = await loadGate(false); if (!g.ok) openGate(); }
  } catch (e) {}
});

/* ---------- boot / data ---------- */
async function loadMe() { ME = await api('/api/me'); }
async function boot() {
  if (!tg || !tg.initData) { fatal('Open this app from the Telegram bot.'); return; }
  try {
    const g = await loadGate(false);
    if (!g.ok) { gateOpen = false; openGate(); return; }
    await loadMe();
    $('#nav').style.display = 'block';
    go(TAB);
    if (typeof show_11849985 === 'function' && !window.__inapp) {
      window.__inapp = true;
      try { show_11849985({ type: 'inApp', inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 5, everyPage: false } }); } catch (e) {}
    }
  } catch (e) { if (e.code !== 'gate') fatal(errMsg(e)); }
}

/* ---------- navigation ---------- */
function drawNav() {
  const tabs = [['home', 'home', 'Home'], ['earn', 'tasks', 'Earn'], ['spin', 'spin', 'Spin'], ['invite', 'users', 'Invite'], ['wallet', 'wallet', 'Wallet']];
  if (ME && ME.is_admin) tabs.push(['admin', 'shield', 'Admin']);
  $('#navin').innerHTML = tabs.map(([id, i, l]) => `<button class="${TAB === id ? 'on' : ''}" onclick="go('${id}')">${ic(i)}<span>${l}</span></button>`).join('');
}
async function go(tab) {
  TAB = tab; drawNav(); window.scrollTo(0, 0);
  try {
    if (tab === 'earn') TASKS = (await api('/api/tasks')).tasks;
    if (tab === 'spin') WINNERS = (await api('/api/winners')).winners;
    if (tab === 'invite') TOP = (await api('/api/leaderboard')).top;
    if (tab === 'wallet') WDS = (await api('/api/withdrawals')).items;
    if (tab === 'admin') ADMIN = await api('/api/admin/overview');
  } catch (e) { if (e.code !== 'gate') toast(errMsg(e)); }
  render();
}
function render() {
  const v = { home: vHome, earn: vEarn, spin: vSpin, invite: vInvite, wallet: vWallet, admin: vAdmin }[TAB];
  $('#app').innerHTML = v();
  if (TAB === 'spin') buildWheel(wheelKind);
}
const etb = (c) => (c / ME.cfg.coin_per_etb).toFixed(2);

/* ---------- home ---------- */
function vHome() {
  const u = ME.user, c = ME.cfg, st = u.state;
  const pct = Math.min(100, ((u.streak % 7) / 7) * 100 || (u.streak > 0 && u.streak % 7 === 0 ? 100 : 0));
  let action;
  if (st === 'done') action = `<button class="btn ghost" disabled>${ic('check')}Checked in today</button>`;
  else if (st === 'recoverable') action = `<p class="muted" style="margin-bottom:10px">You missed a day. Save your ${u.streak}-day streak for ${c.freeze_price} coins, or start over.</p>
      <div class="grid2" style="gap:10px"><button class="btn" onclick="freeze()">Save streak</button><button class="btn ghost" onclick="checkin(true)">Start over</button></div>`;
  else action = `<button class="btn" onclick="checkin()">${ic('flame')}${st === 'lost' || st === 'new' ? 'Start streak' : 'Check in'}</button>`;
  return `
  <div class="card hero">
    <div class="muted">Balance</div>
    <div class="amt">${fmt(u.coins)}<small>coins</small></div>
    <div class="etb">${etb(u.coins)} ETB</div>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:4px">
      <div class="flame">${ic('flame')}</div>
      <div class="grow"><div class="t" style="font-weight:650;font-size:17px">${u.streak}-day streak</div><div class="muted">Best: ${u.best} days</div></div>
      <span class="badge b${u.level}">${LEVELS[u.level - 1] || 'Gold'}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="muted" style="margin-bottom:14px">${u.level >= c.levels.length ? 'Top level reached.' : `Check in 7 days in a row to reach ${LEVELS[u.level]} and earn ${c.milestone_bonus} bonus coins.`}</p>
    ${action}
  </div>
  <div class="grid2">
    <div class="card" onclick="go('earn')"><div class="row muted">${ic('play')}Ads today</div><div style="font-size:24px;font-weight:700;margin-top:6px">${c.ads_today}/${c.ads_limit}</div></div>
    <div class="card" onclick="go('spin')"><div class="row muted">${ic('spin')}Free spins</div><div style="font-size:24px;font-weight:700;margin-top:6px">${c.spin.free_left}</div></div>
  </div>`;
}
async function checkin(restart) {
  if (busy) return; busy = true;
  try {
    const r = await api('/api/checkin', { restart: !!restart });
    haptic(); toast(r.bonus ? `Level up! +${r.bonus} coins` : `Streak: ${r.streak} days`);
    await loadMe(); render();
  } catch (e) { if (e.code === 'recoverable') { await loadMe(); render(); } else if (e.code !== 'gate') toast(errMsg(e)); }
  busy = false;
}
async function freeze() {
  if (busy) return; busy = true;
  try { await api('/api/streak/freeze', {}); await api('/api/checkin', {}); haptic(); toast('Streak saved'); await loadMe(); render(); }
  catch (e) { if (e.code !== 'gate') toast(errMsg(e)); await loadMe().catch(() => {}); render(); }
  busy = false;
}

/* ---------- earn: ads + tasks ---------- */
function vEarn() {
  const c = ME.cfg;
  const tasks = TASKS.length ? TASKS.map((t) => {
    let btn;
    if (t.type === 'channel') btn = `<button class="btn ghost sm" onclick="openUrl('${esc(t.url)}')">Join</button><button class="btn sm" onclick="verifyTask(${t.id},this)">Verify</button>`;
    else if (t.my_status === 'pending') btn = `<span class="pill">In review</span>`;
    else btn = `<button class="btn ghost sm" onclick="openUrl('${esc(t.url)}')">Open</button><button class="btn sm" onclick="startTask(${t.id})">${t.my_status === 'awaiting' ? 'Send proof' : 'Submit'}</button>`;
    return `<div class="item"><div class="grow"><div class="t">${esc(t.title)}</div><div class="muted">+${t.reward} coins${t.max_users ? ` · ${Math.max(0, t.max_users - t.taken)} spots left` : ''}</div>${t.my_status === 'rejected' ? '<div style="color:var(--bad);font-size:12px">Rejected. Try again.</div>' : ''}</div><div class="row" style="gap:8px">${btn}</div></div>`;
  }).join('') : '<p class="muted">No tasks right now. New tasks appear here.</p>';
  return `
  <div class="card">
    <div class="row between"><div><div style="font-weight:650;font-size:17px">Watch an ad</div><div class="muted">+${c.ad_reward} coins per ad</div></div><span class="pill">${c.ads_today}/${c.ads_limit} today</span></div>
    <button class="btn" style="margin-top:14px" id="adbtn" onclick="watchAd(this)" ${c.ads_today >= c.ads_limit ? 'disabled' : ''}>${ic('play')}${c.ads_today >= c.ads_limit ? 'Limit reached' : 'Watch ad'}</button>
  </div>
  <h2>Tasks</h2><div class="card">${tasks}</div>`;
}
function openUrl(u) { if (tg && /t\.me\//.test(u) && tg.openTelegramLink) tg.openTelegramLink(u); else if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank'); }
async function watchAd(btn) {
  if (busy) return; busy = true; btn.disabled = true;
  try {
    const s = await api('/api/ad/start', {});
    if (typeof show_11849985 !== 'function') throw Object.assign(new Error('ads_unavailable'), { code: 'ads_unavailable' });
    try { await show_11849985(); } catch (e) { throw Object.assign(new Error('ad_closed'), { code: 'ad_closed' }); }
    const r = await api('/api/ad/complete', { nonce: s.nonce });
    haptic(); toast(`+${r.reward} coins`);
    await loadMe(); render();
  } catch (e) { if (e.code !== 'gate') toast(errMsg(e)); btn.disabled = false; }
  busy = false;
}
async function verifyTask(id, btn) {
  if (busy) return; busy = true; btn.disabled = true;
  try { const r = await api(`/api/tasks/${id}/verify`, {}); haptic(); toast(`+${r.reward} coins`); TASKS = (await api('/api/tasks')).tasks; await loadMe(); render(); }
  catch (e) { if (e.code !== 'gate') toast(errMsg(e)); btn.disabled = false; }
  busy = false;
}
async function startTask(id) {
  if (busy) return; busy = true;
  try {
    const r = await api(`/api/tasks/${id}/start`, {});
    toast('Send your screenshot to the bot chat');
    setTimeout(() => { if (tg && tg.openTelegramLink) tg.openTelegramLink(r.bot); else window.open(r.bot, '_blank'); }, 500);
  } catch (e) { if (e.code !== 'gate') toast(errMsg(e)); }
  busy = false;
}

/* ---------- spin ---------- */
function vSpin() {
  const s = ME.cfg.spin;
  const win = WINNERS.length ? WINNERS.map((w) => `${esc(w.name || 'Someone')} won ${w.prize} coins`).join('   |   ') : 'Big wins show up here';
  return `
  <div class="ticker"><span>${win}</span></div>
  <div class="wheelbox"><div class="pointer"></div><div id="wheel"></div></div>
  <div class="card">
    <button class="btn" id="fbtn" onclick="doSpin('free')" ${s.free_left ? '' : 'disabled'}>${ic('spin')}Free spin (${s.free_left} left)</button>
    <button class="btn ghost" style="margin-top:10px" id="pbtn" onclick="doSpin('paid')" ${ME.user.coins >= s.cost ? '' : 'disabled'}>Spin for ${s.cost} coins</button>
    <p class="muted" style="margin-top:12px">Free spins reset every day. Paid spins use your coins, and the odds are shown below.</p>
    <div class="odds">${s.paid_odds.map(([p, o]) => `<div><b>${p}</b>${o}%</div>`).join('')}</div>
  </div>`;
}
function segs(kind) {
  const s = ME.cfg.spin;
  const list = kind === 'free' ? s.free_prizes : [...new Set(s.paid_odds.map((r) => r[0]))].sort((a, b) => a - b);
  const out = []; for (let i = 0; i < 8; i++) out.push(list[i % list.length]);
  return out;
}
function buildWheel(kind) {
  wheelKind = kind; const arr = segs(kind), R = 96, cols = ['#1e3357', '#2a4a7c', '#3a2a12', '#5a4216'];
  const pt = (a) => [100 + R * Math.sin(a), 100 - R * Math.cos(a)];
  let svg = '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="99" fill="#0f1b30" stroke="#f0b94d" stroke-width="2"/>';
  arr.forEach((p, i) => {
    const a1 = (i * 45) * Math.PI / 180, a2 = ((i + 1) * 45) * Math.PI / 180, [x1, y1] = pt(a1), [x2, y2] = pt(a2);
    svg += `<path d="M100,100 L${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2} Z" fill="${p === 0 ? cols[0] : (i % 2 ? cols[1] : cols[3])}" stroke="#0f1b30" stroke-width="1"/>`;
    svg += `<text x="100" y="34" transform="rotate(${i * 45 + 22.5} 100 100)" text-anchor="middle" font-size="14" font-weight="700" fill="${p === 0 ? '#93a5c2' : '#f0b94d'}">${p}</text>`;
  });
  svg += '<circle cx="100" cy="100" r="10" fill="#f0b94d"/></svg>';
  const w = $('#wheel'); if (!w) return;
  w.style.transition = 'none'; w.style.transform = 'rotate(0deg)'; rot = 0; w.innerHTML = svg;
}
async function doSpin(kind) {
  if (busy) return; busy = true;
  $('#fbtn').disabled = true; $('#pbtn').disabled = true;
  try {
    const r = await api('/api/spin', { kind });
    buildWheel(kind);
    const arr = segs(kind), idxs = arr.map((p, i) => (p === r.prize ? i : -1)).filter((i) => i >= 0);
    const idx = idxs.length ? idxs[Math.floor(Math.random() * idxs.length)] : 0;
    const w = $('#wheel'); void w.offsetWidth;
    const target = 360 * 5 + ((360 - (idx * 45 + 22.5)) % 360);
    w.style.transition = ''; w.style.transform = `rotate(${target}deg)`;
    await sleep(4200);
    ME.user.coins = r.coins; ME.cfg.spin.free_left = r.free_left;
    if (r.prize > 0) { haptic(); toast(`You won ${r.prize} coins`); } else toast('No prize this time');
    const t = $('#fbtn'), p = $('#pbtn');
    t.disabled = !r.free_left; t.innerHTML = `${ic('spin')}Free spin (${r.free_left} left)`; p.disabled = r.coins < ME.cfg.spin.cost;
  } catch (e) { if (e.code !== 'gate') toast(errMsg(e)); const t = $('#fbtn'); if (t) { t.disabled = !ME.cfg.spin.free_left; $('#pbtn').disabled = ME.user.coins < ME.cfg.spin.cost; } }
  busy = false;
}

/* ---------- invite ---------- */
function vInvite() {
  const c = ME.cfg, w = c.withdraw;
  return `
  <div class="card">
    <div style="font-weight:650;font-size:17px">Invite friends</div>
    <p class="muted" style="margin:6px 0 14px">A friend counts when they join the channels and watch ads on 2 different days. You earn ${c.referral_reward} coins for each one.</p>
    <div class="row between"><span>Qualified referrals</span><b>${w.refs_have}/${w.refs_required}</b></div>
    <div class="bar"><i style="width:${Math.min(100, (w.refs_have / Math.max(1, w.refs_required)) * 100)}%"></i></div>
    <p class="muted" style="margin-bottom:14px">${ME.invited} invited so far</p>
    <button class="btn" onclick="copyRef()">${ic('copy')}Copy invite link</button>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:6px">${ic('gift')}<b>Promo code</b></div>
    <div class="row"><input id="promo" placeholder="Enter code" autocapitalize="characters" style="margin:0"><button class="btn sm" onclick="redeem()">Redeem</button></div>
  </div>
  <h2>Top ad watchers this week</h2>
  <div class="card">${TOP.length ? TOP.map((t, i) => `<div class="item"><span class="pill${i === 0 ? '' : ' ok'}" style="min-width:30px;text-align:center">${i + 1}</span><div class="grow">${esc(t.name || 'User')}</div><b>${t.ads} ads</b></div>`).join('') : '<p class="muted">No activity yet this week.</p>'}
    <p class="muted" style="margin-top:12px">${ic('trophy')} Weekly winner gets free streak saves and a higher ad limit next week.</p></div>`;
}
async function copyRef() {
  try { await navigator.clipboard.writeText(ME.ref_link); toast('Link copied'); }
  catch (e) { if (tg && tg.openTelegramLink) tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(ME.ref_link)); else toast(ME.ref_link); }
}
async function redeem() {
  const code = $('#promo').value.trim(); if (!code || busy) return; busy = true;
  try { const r = await api('/api/promo', { code }); haptic(); toast(`+${r.reward} coins`); await loadMe(); render(); }
  catch (e) { if (e.code !== 'gate') toast(errMsg(e)); }
  busy = false;
}

/* ---------- wallet ---------- */
function vWallet() {
  const w = ME.cfg.withdraw, u = ME.user;
  const wait = w.next_at ? new Date(w.next_at) : null;
  const blocked = !w.open ? 'Withdrawals are closed right now.' : u.flagged ? 'Your account is under review.' : wait ? `Next withdrawal: ${wait.toLocaleString()}` : w.refs_have < w.refs_required ? `You need ${w.refs_required - w.refs_have} more qualified referrals.` : '';
  return `
  <div class="card hero"><div class="muted">Available</div><div class="amt">${etb(u.coins)}<small>ETB</small></div><div class="etb">${fmt(u.coins)} coins</div></div>
  <div class="card">
    <div style="font-weight:650;font-size:17px">Withdraw</div>
    <p class="muted" style="margin:6px 0 4px">Minimum ${w.min_etb} ETB. One withdrawal every ${Math.round(w.interval_h / 24)} days. We check that you are still in all channels before paying.</p>
    ${blocked ? `<p style="color:var(--gold);margin:10px 0">${esc(blocked)}</p>` : ''}
    <label>Amount (ETB)<input id="wamt" type="number" inputmode="decimal" min="${w.min_etb}" step="0.01" placeholder="${w.min_etb}"></label>
    <label>Method<select id="wmeth"><option>Telebirr</option><option>CBE Birr</option><option>Commercial Bank of Ethiopia</option></select></label>
    <label>Phone or account number<input id="wacc" inputmode="numeric" placeholder="09..."></label>
    <button class="btn" style="margin-top:16px" onclick="withdraw()" ${blocked ? 'disabled' : ''}>${ic('send')}Request withdrawal</button>
  </div>
  <h2>History</h2>
  <div class="card">${WDS.length ? WDS.map((x) => `<div class="item"><div class="grow"><div class="t">${x.etb} ETB</div><div class="muted">${esc(x.method)} · ${new Date(x.created_at).toLocaleDateString()}</div></div><span class="pill ${x.status === 'paid' ? 'ok' : x.status === 'rejected' ? 'bad' : ''}">${x.status === 'paid' ? 'Paid' : x.status === 'rejected' ? 'Rejected' : 'Pending'}</span></div>`).join('') : '<p class="muted">No withdrawals yet.</p>'}</div>`;
}
async function withdraw() {
  if (busy) return; busy = true;
  try {
    await api('/api/withdraw', { etb: $('#wamt').value, method: $('#wmeth').value, account: $('#wacc').value });
    haptic(); toast('Request sent. You will be notified when it is paid.');
    await loadMe(); WDS = (await api('/api/withdrawals')).items; render();
  } catch (e) { if (e.code !== 'gate') toast(errMsg(e)); }
  busy = false;
}

/* ---------- admin ---------- */
const SET_LABELS = {
  ad_reward: 'Coins per ad', ad_cooldown: 'Seconds between ads', ads_per_level: 'Ads per day by level (JSON list)', referral_reward: 'Referral reward (coins)',
  milestone_bonus: 'Level-up bonus (coins)', freeze_price: 'Streak save price (coins)', free_spins: 'Free spins per day', spin_cost: 'Paid spin cost (coins)',
  free_table: 'Free spin prizes [[prize, weight], ...]', paid_table: 'Paid spin prizes [[prize, weight], ...]', coin_per_etb: 'Coins per 1 ETB',
  min_withdraw_etb: 'Minimum withdrawal (ETB)', withdraw_referrals_required: 'Referrals required to withdraw', withdraw_interval_hours: 'Hours between withdrawals',
  global_daily_cap_etb: 'Daily payout cap (ETB)', gate_channels: 'Required channels (JSON list, e.g. ["@a","@b"])',
};
function vAdmin() {
  if (!ADMIN) return '<div class="spinner"></div>';
  const s = ADMIN.stats;
  return `
  <div class="grid2"><div class="card"><div class="muted">Users</div><b style="font-size:22px">${s.users}</b><div class="muted">+${s.new_today} today</div></div>
    <div class="card"><div class="muted">Coins owed</div><b style="font-size:22px">${fmt(s.coins_owed)}</b><div class="muted">${(s.coins_owed / ME.cfg.coin_per_etb).toFixed(0)} ETB</div></div></div>
  <div class="card" style="margin-top:12px"><div class="row between"><b>Withdrawals</b><label class="row" style="margin:0;gap:8px;color:var(--text)"><input type="checkbox" style="width:auto;margin:0" ${ADMIN.settings.withdrawals_open !== false ? 'checked' : ''} onchange="setSetting('withdrawals_open', this.checked)">Open</label></div>
    ${ADMIN.pending.length ? ADMIN.pending.map((w) => `<div class="item"><div class="grow"><div class="t">#${w.id} ${esc(w.first_name)} · ${w.etb} ETB</div><div class="muted">${esc(w.method)} ${esc(w.account)}</div></div></div>`).join('') + '<p class="muted" style="margin-top:8px">Approve or reject in the bot chat.</p>' : '<p class="muted" style="margin-top:8px">No pending withdrawals.</p>'}
    <p class="muted" style="margin-top:8px">Flagged accounts: ${s.flagged} · Task proofs waiting: ${s.pending_tasks}</p></div>
  <h2>New task</h2>
  <div class="card">
    <label>Type<select id="ttype" onchange="taskType()"><option value="channel">Join a Telegram channel (auto-checked)</option><option value="social">Social task with screenshot</option></select></label>
    <label>Title<input id="ttitle" placeholder="Subscribe to our YouTube"></label>
    <label id="lchat">Channel (@username)<input id="tchat" placeholder="@channel"></label>
    <label id="lurl" style="display:none">Link<input id="turl" placeholder="https://..."></label>
    <label>Reward (coins)<input id="trew" type="number" value="10"></label>
    <label>Max users (empty = unlimited)<input id="tmax" type="number" placeholder="500"></label>
    <button class="btn" style="margin-top:14px" onclick="addTask()">Add task</button>
  </div>
  <h2>All tasks</h2>
  <div class="card">${ADMIN.tasks.length ? ADMIN.tasks.map((t) => `<div class="item"><div class="grow"><div class="t">${esc(t.title)}</div><div class="muted">${t.type} · ${t.reward} coins · ${t.taken}${t.max_users ? '/' + t.max_users : ''} done</div></div><button class="btn ghost sm" onclick="toggleTask(${t.id})">${t.active ? 'Stop' : 'Start'}</button></div>`).join('') : '<p class="muted">No tasks yet.</p>'}</div>
  <h2>Promo codes</h2>
  <div class="card">${ADMIN.promos.map((p) => `<div class="item"><div class="grow"><b>${esc(p.code)}</b><div class="muted">${p.reward} coins · ${p.uses}${p.max_uses ? '/' + p.max_uses : ''} used</div></div></div>`).join('')}
    <label>Code<input id="pcode" placeholder="WELCOME"></label><label>Reward (coins)<input id="prew" type="number" value="20"></label><label>Max uses<input id="pmax" type="number" placeholder="100"></label>
    <button class="btn" style="margin-top:14px" onclick="addPromo()">Save code</button></div>
  <h2>Settings</h2>
  <div class="card">${Object.keys(SET_LABELS).map((k) => `<label>${SET_LABELS[k]}<input id="s_${k}" value='${esc(JSON.stringify(ADMIN.settings[k]))}'></label><button class="btn ghost sm" style="margin-top:8px" onclick="saveSetting('${k}')">Save</button>`).join('')}</div>`;
}
function taskType() { const c = $('#ttype').value === 'channel'; $('#lchat').style.display = c ? '' : 'none'; $('#lurl').style.display = c ? 'none' : ''; }
async function adm(path, body, okMsg) {
  try { await api(path, body || {}); toast(okMsg || 'Saved'); ADMIN = await api('/api/admin/overview'); render(); }
  catch (e) { toast(errMsg(e)); }
}
const addTask = () => adm('/api/admin/task', { type: $('#ttype').value, title: $('#ttitle').value, chat: $('#tchat').value, url: $('#turl').value, reward: $('#trew').value, max_users: $('#tmax').value }, 'Task added');
const toggleTask = (id) => adm(`/api/admin/task/${id}/toggle`);
const addPromo = () => adm('/api/admin/promo', { code: $('#pcode').value, reward: $('#prew').value, max_uses: $('#pmax').value });
const setSetting = (key, value) => adm('/api/admin/setting', { key, value });
function saveSetting(k) { let v; try { v = JSON.parse($('#s_' + k).value); } catch (e) { return toast('Invalid format'); } return setSetting(k, v); }

boot();
</script>
